<!DOCTYPE html>
<html lang="en" data-theme="violet">
<head>
  <meta charset="UTF-8">
  <title>Music</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="app.css">
  <style>
    * { box-sizing: border-box; }
    body { overflow: hidden; background: var(--color-bg); user-select: none; }
    svg { width: 100%; height: 100%; fill: currentColor; display: block; }
    button { color: inherit; }
    #app { display: grid; grid-template-columns: 210px 1fr; grid-template-rows: 1fr 84px; height: 100%; }

    /* sidebar */
    aside { grid-row: 1; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; background: var(--color-surface); border-right: 1px solid var(--color-border); overflow: auto; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; font-size: 18px; font-weight: 700; letter-spacing: .3px; }
    .brand i { width: 30px; height: 30px; border-radius: 9px; padding: 5px; background: var(--color-pin); color: var(--color-text-dark, #111); }
    .navb { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: none; background: none; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--color-text-muted); cursor: pointer; text-align: left; }
    .navb svg { width: 20px; height: 20px; flex: none; }
    .navb:hover { color: var(--color-text); background: var(--overlay-hover); }
    .navb.sel { color: var(--color-text); background: var(--overlay-hover-strong); }
    .navb .cnt { margin-left: auto; font-size: 11px; color: var(--color-text-subtle); }
    .sep { height: 1px; background: var(--color-border); margin: 10px 8px; }
    .srcbox { margin-top: auto; padding: 10px; border-radius: 12px; background: var(--color-surface-2); border: 1px solid var(--color-border); }
    .srcbox small { display: block; color: var(--color-text-subtle); font-size: 11px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .6px; }
    .seg { display: flex; flex-direction: column; gap: 4px; }
    .seg button { text-align: left; padding: 7px 10px; border-radius: 8px; border: none; background: none; font-size: 12px; cursor: pointer; color: var(--color-text-muted); }
    .seg button b { display: block; font-size: 13px; color: inherit; }
    .seg button span { font-size: 11px; opacity: .75; }
    .seg button:hover { background: var(--overlay-hover); }
    .seg button.on { background: var(--color-pin); color: var(--color-text-dark, #111); }

    /* main */
    main { grid-row: 1; position: relative; overflow: hidden; background: var(--color-surface-3); }
    #backdrop { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(70px) saturate(1.4); opacity: .0; transition: opacity .8s, background-image .5s; pointer-events: none; }
    #backdrop.on { opacity: .38; }
    #scroll { position: absolute; inset: 0; overflow-y: auto; padding: 0 28px 30px; }
    .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 16px 0 14px; margin-bottom: 4px; backdrop-filter: blur(14px); margin-left: -28px; margin-right: -28px; padding-left: 28px; padding-right: 28px; }
    .search { flex: 1; max-width: 520px; position: relative; }
    .search svg { position: absolute; left: 14px; top: 11px; width: 18px; height: 18px; color: var(--color-text-subtle); pointer-events: none; }
    .search input { width: 100%; height: 40px; padding: 0 40px 0 42px; border-radius: 20px; border: 1px solid var(--color-border-strong); background: var(--color-surface-2); color: var(--color-text); font-size: 14px; outline: none; user-select: text; transition: .15s; }
    .search input:focus { border-color: var(--color-border-hover); background: var(--color-surface); box-shadow: 0 0 0 3px var(--overlay-hover); }
    .search .clr { position: absolute; right: 8px; top: 7px; width: 26px; height: 26px; border-radius: 50%; border: none; background: none; cursor: pointer; padding: 6px; color: var(--color-text-subtle); display: none; }
    .search .clr:hover { background: var(--overlay-hover-strong); color: var(--color-text); }
    .search.has .clr { display: block; }
    h2 { font-size: 22px; margin: 18px 0 14px; font-weight: 700; }
    h2 small { font-size: 12px; font-weight: 400; color: var(--color-text-subtle); margin-left: 8px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
    .chip { padding: 7px 16px; border-radius: 20px; border: 1px solid var(--color-border-strong); background: var(--color-surface-2); color: var(--color-text-muted); font-size: 13px; cursor: pointer; transition: .12s; }
    .chip:hover { color: var(--color-text); border-color: var(--color-border-hover); }
    .chip.on { background: var(--color-text); color: var(--color-bg, #000); border-color: var(--color-text); }

    /* hero */
    .hero { display: flex; gap: 20px; align-items: flex-end; padding: 22px; border-radius: 18px; margin: 6px 0 4px; background: linear-gradient(135deg, var(--color-chrome), var(--color-surface-2)); border: 1px solid var(--color-border); overflow: hidden; position: relative; }
    .hero .art { width: 150px; height: 150px; flex: none; border-radius: 14px; box-shadow: 0 14px 40px #0008; background-size: cover; background-position: center; }
    .hero small { color: var(--color-text-muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
    .hero h1 { font-size: 30px; margin: 6px 0 4px; line-height: 1.1; }
    .hero p { margin: 0 0 14px; color: var(--color-text-muted); }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 22px; border-radius: 20px; border: none; background: var(--color-pin); color: var(--color-text-dark, #111); font-weight: 700; font-size: 14px; cursor: pointer; transition: transform .1s; }
    .btn svg { width: 18px; height: 18px; }
    .btn:hover { transform: scale(1.04); }
    .btn.ghost { background: var(--overlay-hover-strong); color: var(--color-text); margin-left: 8px; }

    /* grid cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .card2 { padding: 12px; border-radius: 14px; background: var(--color-surface-2); border: 1px solid transparent; cursor: pointer; transition: .15s; position: relative; }
    .card2:hover { background: var(--overlay-browser-tab); border-color: var(--color-border); transform: translateY(-2px); }
    .card2 .cv { position: relative; aspect-ratio: 1; border-radius: 10px; background-size: cover; background-position: center; background-color: var(--color-surface); box-shadow: 0 8px 20px #0005; }
    .card2 .pl { position: absolute; right: 8px; bottom: 8px; width: 42px; height: 42px; padding: 11px; border-radius: 50%; background: var(--color-pin); color: var(--color-text-dark, #111); opacity: 0; transform: translateY(8px); transition: .18s; box-shadow: 0 6px 16px #0007; }
    .card2:hover .pl, .card2.cur .pl { opacity: 1; transform: none; }
    .card2 b { display: block; margin-top: 10px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card2 span { display: block; margin-top: 2px; font-size: 12px; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card2.cur b { color: var(--color-pin); }

    /* list rows */
    .list { display: flex; flex-direction: column; }
    .lh, .row2 { display: grid; grid-template-columns: 36px minmax(0, 2.2fr) minmax(0, 1.2fr) 50px 40px; align-items: center; gap: 12px; padding: 0 12px; }
    .lh { height: 30px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--color-text-subtle); border-bottom: 1px solid var(--color-border); margin-bottom: 4px; }
    .row2 { height: 56px; border-radius: 10px; cursor: pointer; }
    .row2:hover { background: var(--overlay-hover-strong); }
    .row2.cur { background: var(--overlay-hover); }
    .row2 .n { text-align: center; color: var(--color-text-subtle); font-size: 13px; font-variant-numeric: tabular-nums; }
    .row2 .n svg { display: none; width: 16px; height: 16px; margin: auto; color: var(--color-text); }
    .row2:hover .n span { display: none; }
    .row2:hover .n svg { display: block; }
    .row2.cur .n span { display: none; }
    .eq { display: none; height: 14px; align-items: flex-end; justify-content: center; gap: 2px; }
    .eq i { width: 3px; background: var(--color-pin); border-radius: 1px; animation: eq .9s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: .25s; } .eq i:nth-child(3) { animation-delay: .5s; }
    @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 14px; } }
    .row2.cur.playing .eq { display: flex; }
    .row2.cur.playing:hover .eq { display: none; }
    .ti { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .ti .th { width: 40px; height: 40px; flex: none; border-radius: 7px; background: var(--color-surface) center / cover; }
    .ti div { min-width: 0; }
    .ti b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ti span { display: block; font-size: 12px; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row2.cur .ti b { color: var(--color-pin); }
    .al { font-size: 13px; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .du { font-size: 13px; color: var(--color-text-muted); text-align: right; font-variant-numeric: tabular-nums; }
    .hb { width: 30px; height: 30px; padding: 6px; border: none; background: none; border-radius: 50%; color: var(--color-text-subtle); cursor: pointer; opacity: 0; }
    .row2:hover .hb, .hb.on { opacity: 1; }
    .hb.on { color: var(--color-pin); }
    .hb:hover { color: var(--color-text); }
    .hb.on:hover { color: var(--color-pin); }

    /* states */
    .skel { height: 56px; border-radius: 10px; margin-bottom: 4px; background: linear-gradient(90deg, var(--color-surface-2) 25%, var(--overlay-hover) 50%, var(--color-surface-2) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
    .skc { aspect-ratio: .8; border-radius: 14px; background: linear-gradient(90deg, var(--color-surface-2) 25%, var(--overlay-hover) 50%, var(--color-surface-2) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
    @keyframes sh { to { background-position: -200% 0; } }
    .empty { padding: 60px 20px; text-align: center; color: var(--color-text-muted); }
    .empty svg { width: 46px; height: 46px; margin: 0 auto 12px; opacity: .5; }
    .empty p { margin: 6px 0 16px; font-size: 13px; }

    /* player */
    footer { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: 1fr minmax(260px, 1.4fr) 1fr; align-items: center; gap: 16px; padding: 0 18px; background: var(--color-surface); border-top: 1px solid var(--color-border); }
    .np { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .np .cover { width: 56px; height: 56px; flex: none; border-radius: 8px; background: var(--color-surface-3) center / cover; box-shadow: 0 4px 14px #0006; display: flex; align-items: center; justify-content: center; color: var(--color-text-subtle); padding: 14px; }
    .np .cover.has svg { display: none; }
    .np .meta { min-width: 0; }
    .np b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np span { display: block; font-size: 12px; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np .hb { opacity: 1; flex: none; }
    .center { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
    .ctl { display: flex; align-items: center; gap: 10px; }
    .ib { width: 34px; height: 34px; padding: 8px; border: none; background: none; border-radius: 50%; cursor: pointer; color: var(--color-text-muted); transition: .12s; position: relative; }
    .ib:hover { color: var(--color-text); background: var(--overlay-hover); }
    .ib.on { color: var(--color-pin); }
    .ib.on:after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--color-pin); }
    .ib.play { width: 42px; height: 42px; padding: 11px; background: var(--color-text); color: var(--color-bg, #000); }
    .ib.play:hover { transform: scale(1.07); background: var(--color-text); }
    .ib .one { position: absolute; top: 6px; right: 5px; font-size: 9px; font-weight: 800; }
    .seekrow { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 560px; font-size: 11px; color: var(--color-text-subtle); font-variant-numeric: tabular-nums; }
    .seekrow span { width: 36px; }
    .seekrow span:first-child { text-align: right; }
    input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 14px; background: none; cursor: pointer; --p: 0%; margin: 0; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--color-text) var(--p), var(--overlay-hover-strong) var(--p)); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: var(--color-text); opacity: 0; transition: opacity .1s; }
    input[type=range]:hover::-webkit-slider-thumb, input[type=range]:focus::-webkit-slider-thumb { opacity: 1; }
    input[type=range]:hover::-webkit-slider-runnable-track { background: linear-gradient(90deg, var(--color-pin) var(--p), var(--overlay-hover-strong) var(--p)); }
    .right { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    .right input[type=range] { flex: none; width: 100px; }
    #msg { position: absolute; left: 50%; bottom: 96px; transform: translate(-50%, 20px); padding: 9px 16px; border-radius: 20px; background: var(--color-surface-3); border: 1px solid var(--color-border-strong); font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; white-space: nowrap; }
    #msg.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 760px) {
      #app { grid-template-columns: 62px 1fr; }
      .brand span, .navb span, .navb .cnt, .srcbox { display: none; }
      .navb { justify-content: center; padding: 11px 0; }
      .brand { justify-content: center; padding-left: 0; padding-right: 0; }
      footer { grid-template-columns: 1fr auto; }
      .right { display: none; }
      .al, .lh .c3 { display: none; }
      .lh, .row2 { grid-template-columns: 36px minmax(0, 1fr) 50px 40px; }
      .hero .art { width: 100px; height: 100px; }
      .hero h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><i id="logo"></i><span>Music</span></div>
    <button class="navb sel" data-v="home"><svg viewBox="0 0 24 24"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg><span>Home</span></button>
    <button class="navb" data-v="search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><span>Search</span></button>
    <div class="sep"></div>
    <button class="navb" data-v="liked"><svg viewBox="0 0 24 24"><path d="M12 21 10.6 19.8C5.4 15.2 2 12.1 2 8.3A5.3 5.3 0 0 1 7.3 3c1.7 0 3.4.8 4.7 2.1A6.4 6.4 0 0 1 16.7 3 5.3 5.3 0 0 1 22 8.3c0 3.800-3.400 6.900-8.600 11.500z"/></svg><span>Liked songs</span><em class="cnt" id="likeCnt" style="font-style:normal"></em></button>
    <button class="navb" data-v="recent"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-2.100-5L14 10h8V2l-3.100 3.100A9 9 0 0 0 13 3zm-1 5v5l4.300 2.500.8-1.400L14 12V8z"/></svg><span>Recently played</span></button>
    <button class="navb" data-v="queue"><svg viewBox="0 0 24 24"><path d="M3 5h14v2H3zm0 6h14v2H3zm0 6h8v2H3zm13 0v-4l5 2z"/></svg><span>Queue</span><em class="cnt" id="qCnt" style="font-style:normal"></em></button>
    <div class="srcbox">
      <small>Music source</small>
      <div class="seg" id="src">
        <button data-s="audius"><b>Audius</b><span>Full-length songs</span></button>
        <button data-s="itunes"><b>iTunes</b><span>30s previews, hit artists</span></button>
      </div>
    </div>
  </aside>

  <main>
    <div id="backdrop"></div>
    <div id="scroll">
      <div class="top">
        <div class="search" id="sbox">
          <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
          <input id="q" placeholder="What do you want to listen to?" spellcheck="false" autocomplete="off">
          <button class="clr" id="clr" title="Clear"><svg viewBox="0 0 24 24"><path d="M6.400 5 12 10.600 17.600 5 19 6.400 13.400 12 19 17.600 17.600 19 12 13.400 6.400 19 5 17.600 10.600 12 5 6.400z"/></svg></button>
        </div>
      </div>
      <div id="view"></div>
    </div>
    <div id="msg"></div>
  </main>

  <footer>
    <div class="np">
      <div class="cover" id="cover"><svg viewBox="0 0 24 24"><path d="M12 3v10.600A4 4 0 1 0 14 17V7h4V3z"/></svg></div>
      <div class="meta"><b id="npT">Nothing playing</b><span id="npA">Pick a song to start</span></div>
      <button class="hb" id="npHeart" title="Like"><svg viewBox="0 0 24 24"><path id="npHp" d="M12 21 10.600 19.800C5.400 15.200 2 12.100 2 8.300A5.300 5.300 0 0 1 7.300 3c1.700 0 3.400.8 4.700 2.100A6.400 6.400 0 0 1 16.700 3 5.300 5.300 0 0 1 22 8.300c0 3.800-3.400 6.900-8.600 11.500z"/></svg></button>
    </div>
    <div class="center">
      <div class="ctl">
        <button class="ib" id="bShuf" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.500-1.500-4.600 4.600-1.400-1.400 4.600-4.600zM3 5h4.500l3.600 4.700-1.200 1.600L6.500 7H3zm13.500 9.600 1.400-1.400L19.500 15 21 13.500V19h-5.500l1.500-1.500zM3 17h3.500l9-12h1.800l-9.900 13H3z"/></svg></button>
        <button class="ib" id="bPrev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.500 7L19 5v14z"/></svg></button>
        <button class="ib play" id="bPlay" title="Play / Pause (Space)"><svg id="playIc" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button>
        <button class="ib" id="bNext" title="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 19V5l9.500 7z"/></svg></button>
        <button class="ib" id="bRep" title="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg><span class="one" id="repOne" style="display:none">1</span></button>
      </div>
      <div class="seekrow"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="tDur">0:00</span></div>
    </div>
    <div class="right">
      <button class="ib" id="bVol" title="Mute"><svg id="volIc" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.500 3A4.500 4.500 0 0 0 14 8v8a4.500 4.500 0 0 0 2.500-4zM14 3.200v2.100a7 7 0 0 1 0 13.400v2.100a9 9 0 0 0 0-17.600z"/></svg></button>
      <input type="range" id="vol" min="0" max="100" value="80">
    </div>
  </footer>
</div>

<audio id="audio" preload="auto"></audio>
<script src="common.js"></script>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const APP = 'GalaxyOS';
  const AUDIUS = 'https://api.audius.co/v1';
  const audio = $('#audio'), view = $('#view');
  const PLAYIC = '<path d="M7 4v16l13-8z"/>', PAUSEIC = '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>';
  const HEART = 'M12 21 10.600 19.800C5.400 15.200 2 12.100 2 8.300A5.300 5.300 0 0 1 7.300 3c1.700 0 3.400.8 4.700 2.100A6.400 6.400 0 0 1 16.700 3 5.300 5.300 0 0 1 22 8.300c0 3.800-3.400 6.900-8.600 11.500z';
  const HEART_LINE = 'M16.500 3c-1.700 0-3.400.9-4.500 2.200C10.900 3.900 9.200 3 7.500 3 4.400 3 2 5.400 2 8.500c0 3.800 3.400 6.900 8.600 11.700L12 21.500l1.400-1.300C18.600 15.400 22 12.300 22 8.500 22 5.400 19.600 3 16.500 3zm-4.400 15.600-.1.100-.1-.1C7.100 14.200 4 11.400 4 8.500 4 6.500 5.500 5 7.500 5c1.500 0 3 1 3.600 2.400h1.900C13.500 6 15 5 16.500 5c2 0 3.500 1.500 3.500 3.500 0 2.900-3.100 5.700-7.900 10.100z';
  $('#logo').innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 9h2.500v6H5zm4.500-4H12v14H9.500zM14 8h2.500v8H14zm4.500-3H21v14h-2.500z"/></svg>';

  /* ---------- storage ---------- */
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem('galaxy.music.' + k)); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('galaxy.music.' + k, JSON.stringify(v)); } catch (e) {} }
  };
  let likes = store.get('likes', []);
  let recent = store.get('recent', []);
  let source = store.get('source', 'audius');
  audio.volume = store.get('vol', 0.8);
  $('#vol').value = Math.round(audio.volume * 100);

  /* ---------- state ---------- */
  let queue = [], idx = -1, shuffle = store.get('shuffle', false), repeat = store.get('repeat', 0);
  let curView = 'home', lastQuery = '', genre = null, reqId = 0;
  const cache = {};
  const isLiked = (t) => likes.some((x) => x.key === t.key);
  const cur = () => queue[idx];

  /* ---------- helpers ---------- */
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  let msgT;
  function say(t) { const m = $('#msg'); m.textContent = t; m.classList.add('show'); clearTimeout(msgT); msgT = setTimeout(() => m.classList.remove('show'), 2600); }
  async function getJSON(url) {
    if (cache[url]) return cache[url];
    const ac = new AbortController(); const to = setTimeout(() => ac.abort(), 15000);
    try {
      const r = await fetch(url, { signal: ac.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json(); cache[url] = j; return j;
    } finally { clearTimeout(to); }
  }
  const bigArt = (u) => (u || '').replace(/\/\d+x\d+bb\./, '/400x400bb.');

  /* ---------- providers ---------- */
  const audiusTrack = (t) => ({
    key: 'a:' + t.id, id: t.id, title: t.title, artist: (t.user && t.user.name) || 'Unknown', album: t.genre || 'Single',
    art: t.artwork ? (t.artwork['480x480'] || t.artwork['150x150'] || t.artwork['1000x1000'] || '') : '',
    src: `${AUDIUS}/tracks/${t.id}/stream?app_name=${APP}`, dur: t.duration || 0, source: 'audius'
  });
  const itunesTrack = (t) => ({
    key: 'i:' + t.trackId, id: t.trackId, title: t.trackName, artist: t.artistName, album: t.collectionName || 'Single',
    art: bigArt(t.artworkUrl100), src: t.previewUrl, dur: Math.round((t.trackTimeMillis || 30000) / 1000), source: 'itunes', preview: true
  });
  const P = {
    audius: {
      genres: ['Electronic', 'Hip-Hop/Rap', 'Pop', 'Lo-Fi', 'Ambient', 'Rock', 'Jazz', 'R&B/Soul', 'House', 'Trap'],
      async trending(g) {
        const j = await getJSON(`${AUDIUS}/tracks/trending?limit=30&time=week&app_name=${APP}` + (g ? `&genre=${encodeURIComponent(g)}` : ''));
        return (j.data || []).map(audiusTrack).filter((t) => t.id);
      },
      async search(q) {
        const j = await getJSON(`${AUDIUS}/tracks/search?query=${encodeURIComponent(q)}&limit=40&app_name=${APP}`);
        return (j.data || []).map(audiusTrack).filter((t) => t.id);
      }
    },
    itunes: {
      genres: ['Top hits', 'Pop', 'Hip hop', 'Rock', 'Chill', 'Dance', 'R&B', 'Country', 'Latin', 'Jazz'],
      async trending(g) { return this.search(g || 'top hits'); },
      async search(q) {
        const j = await getJSON(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&entity=song&limit=40`);
        const seen = new Set();
        return (j.results || []).filter((t) => t.previewUrl && !seen.has(t.trackId) && seen.add(t.trackId)).map(itunesTrack);
      }
    }
  };

  /* ---------- rendering ---------- */
  const svgIcon = (d) => `<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
  function heartBtn(t) {
    const b = document.createElement('button');
    b.className = 'hb' + (isLiked(t) ? ' on' : '');
    b.title = isLiked(t) ? 'Remove from liked' : 'Like';
    b.innerHTML = svgIcon(isLiked(t) ? HEART : HEART_LINE);
    b.addEventListener('click', (e) => { e.stopPropagation(); toggleLike(t); });
    return b;
  }
  function skeleton(kind) {
    const w = document.createElement('div');
    if (kind === 'grid') { w.className = 'grid'; w.innerHTML = '<div class="skc"></div>'.repeat(8); }
    else w.innerHTML = '<div class="skel"></div>'.repeat(8);
    return w;
  }
  function emptyState(title, text, retry) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 3v10.600A4 4 0 1 0 14 17V7h4V3z"/></svg><b></b><p></p>';
    $('b', e).textContent = title; $('p', e).textContent = text;
    if (retry) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Try again'; b.onclick = retry; e.appendChild(b); }
    return e;
  }
  function rowsFor(list, label) {
    const wrap = document.createElement('div');
    wrap.className = 'list';
    wrap.innerHTML = '<div class="lh"><span>#</span><span>Title</span><span class="c3">Album / Genre</span><span style="text-align:right">Time</span><span></span></div>';
    list.forEach((t, i) => {
      const r = document.createElement('div');
      r.className = 'row2'; r.dataset.key = t.key;
      r.innerHTML = `<div class="n"><span>${i + 1}</span><div class="eq"><i></i><i></i><i></i></div>${svgIcon('M7 4v16l13-8z')}</div>
        <div class="ti"><div class="th"></div><div><b></b><span></span></div></div><div class="al"></div><div class="du"></div>`;
      if (t.art) $('.th', r).style.backgroundImage = `url("${t.art}")`;
      $('b', r).textContent = t.title; $('.ti span', r).textContent = t.artist;
      $('.al', r).textContent = t.album; $('.du', r).textContent = t.preview ? '0:30' : fmt(t.dur);
      r.appendChild(heartBtn(t));
      r.addEventListener('click', () => playList(list, i, label));
      wrap.appendChild(r);
    });
    return wrap;
  }
  function gridFor(list, label) {
    const g = document.createElement('div');
    g.className = 'grid';
    list.forEach((t, i) => {
      const c = document.createElement('div');
      c.className = 'card2'; c.dataset.key = t.key;
      c.innerHTML = '<div class="cv"><svg class="pl" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></div><b></b><span></span>';
      if (t.art) $('.cv', c).style.backgroundImage = `url("${t.art}")`;
      $('b', c).textContent = t.title; $('span', c).textContent = t.artist;
      c.addEventListener('click', () => playList(list, i, label));
      g.appendChild(c);
    });
    return g;
  }
  function chipsFor(items, active, onPick) {
    const c = document.createElement('div');
    c.className = 'chips';
    items.forEach((g) => {
      const b = document.createElement('button');
      b.className = 'chip' + (g === active ? ' on' : '');
      b.textContent = g;
      b.onclick = () => onPick(g === active ? null : g);
      c.appendChild(b);
    });
    return c;
  }
  function heading(text, sub) {
    const h = document.createElement('h2'); h.textContent = text;
    if (sub) { const s = document.createElement('small'); s.textContent = sub; h.appendChild(s); }
    return h;
  }

  async function renderHome() {
    const my = ++reqId;
    view.textContent = '';
    const greet = (() => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; })();
    view.appendChild(heading(greet));
    view.appendChild(chipsFor(P[source].genres, genre, (g) => { genre = g; renderHome(); }));
    const holder = document.createElement('div');
    holder.appendChild(skeleton('grid'));
    view.appendChild(holder);
    try {
      const list = await P[source].trending(genre);
      if (my !== reqId) return;
      holder.textContent = '';
      if (!list.length) { holder.appendChild(emptyState('Nothing here yet', 'No songs came back. Try another genre.', renderHome)); return; }
      const label = genre ? `${genre}` : 'Trending';
      const top = list[0];
      const hero = document.createElement('div');
      hero.className = 'hero';
      hero.innerHTML = '<div class="art"></div><div><small></small><h1></h1><p></p><button class="btn"><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>Play</button><button class="btn ghost">Shuffle all</button></div>';
      if (top.art) $('.art', hero).style.backgroundImage = `url("${top.art}")`;
      $('small', hero).textContent = genre ? `${genre} - top pick` : 'Trending now';
      $('h1', hero).textContent = top.title; $('p', hero).textContent = top.artist;
      $('.btn', hero).onclick = () => playList(list, 0, label);
      $('.ghost', hero).onclick = () => { shuffle = true; store.set('shuffle', true); syncModes(); playList(list, Math.floor(Math.random() * list.length), label); };
      holder.appendChild(hero);
      holder.appendChild(heading(genre ? genre : 'Trending this week', source === 'itunes' ? '30-second previews' : ''));
      holder.appendChild(gridFor(list, label));
      markPlaying();
    } catch (e) {
      if (my !== reqId) return;
      holder.textContent = '';
      holder.appendChild(emptyState("Can't reach the music service", 'Check your internet connection and try again.', renderHome));
    }
  }

  async function renderSearch(q) {
    const my = ++reqId;
    view.textContent = '';
    if (!q) {
      view.appendChild(heading('Search'));
      view.appendChild(chipsFor(P[source].genres, null, (g) => { $('#q').value = g; onType(); }));
      view.appendChild(emptyState('Find your next favourite song', 'Search for a song, artist or genre above.'));
      return;
    }
    view.appendChild(heading(`Results for "${q}"`));
    const holder = document.createElement('div');
    holder.appendChild(skeleton('list'));
    view.appendChild(holder);
    try {
      const list = await P[source].search(q);
      if (my !== reqId) return;
      holder.textContent = '';
      if (!list.length) { holder.appendChild(emptyState('No results', `Nothing matched "${q}". Try different words.`)); return; }
      holder.appendChild(rowsFor(list, `Search: ${q}`));
      markPlaying();
    } catch (e) {
      if (my !== reqId) return;
      holder.textContent = '';
      holder.appendChild(emptyState("Can't reach the music service", 'Check your internet connection and try again.', () => renderSearch(q)));
    }
  }

  function renderLibrary(title, list, emptyT, emptyP) {
    reqId++;
    view.textContent = '';
    view.appendChild(heading(title, list.length ? `${list.length} song${list.length === 1 ? '' : 's'}` : ''));
    if (!list.length) { view.appendChild(emptyState(emptyT, emptyP)); return; }
    const play = document.createElement('button');
    play.className = 'btn'; play.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>Play all';
    play.onclick = () => playList(list, 0, title);
    const hold = document.createElement('div'); hold.style.margin = '0 0 12px'; hold.appendChild(play);
    view.appendChild(hold);
    view.appendChild(rowsFor(list, title));
    markPlaying();
  }
  function renderQueue() {
    reqId++;
    view.textContent = '';
    view.appendChild(heading('Queue', queue.length ? `${queue.length} song${queue.length === 1 ? '' : 's'}` : ''));
    if (!queue.length) { view.appendChild(emptyState('Your queue is empty', 'Play a song and what comes next shows up here.')); return; }
    const list = queue;
    const wrap = rowsFor(list, null);
    $$('.row2', wrap).forEach((r, i) => { r.onclick = () => { idx = i; load(); }; });
    view.appendChild(wrap);
    markPlaying();
  }

  function show(v) {
    curView = v;
    $$('.navb').forEach((b) => b.classList.toggle('sel', b.dataset.v === v));
    $('#scroll').scrollTop = 0;
    if (v === 'home') renderHome();
    else if (v === 'search') renderSearch($('#q').value.trim());
    else if (v === 'liked') renderLibrary('Liked songs', likes, 'No liked songs yet', 'Tap the heart on any song to save it here.');
    else if (v === 'recent') renderLibrary('Recently played', recent, 'Nothing played yet', 'Songs you play will show up here.');
    else if (v === 'queue') renderQueue();
  }

  /* ---------- playback ---------- */
  function playList(list, i, label) {
    queue = list.slice();
    idx = i;
    load();
  }
  function load() {
    const t = cur();
    if (!t) return;
    audio.src = t.src;
    audio.play().catch(() => {});
    fail = 0;
    setNow(t);
    recent = [t, ...recent.filter((x) => x.key !== t.key)].slice(0, 40);
    store.set('recent', recent);
    $('#qCnt').textContent = queue.length || '';
  }
  function setNow(t) {
    $('#npT').textContent = t.title; $('#npA').textContent = t.artist + (t.preview ? ' - preview' : '');
    const c = $('#cover');
    c.style.backgroundImage = t.art ? `url("${t.art}")` : '';
    c.classList.toggle('has', !!t.art);
    const bd = $('#backdrop');
    if (t.art) { bd.style.backgroundImage = `url("${t.art}")`; bd.classList.add('on'); } else bd.classList.remove('on');
    syncHeart();
    markPlaying();
    publish(true);
    document.title = `${t.title} - ${t.artist}`;
    if ('mediaSession' in navigator) {
      try { navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album, artwork: t.art ? [{ src: t.art, sizes: '400x400' }] : [] }); } catch (e) {}
    }
  }
  function next(auto) {
    if (!queue.length) return;
    if (auto && repeat === 2) { audio.currentTime = 0; audio.play(); return; }
    let n;
    if (shuffle && queue.length > 1) { do { n = Math.floor(Math.random() * queue.length); } while (n === idx); }
    else { n = idx + 1; if (n >= queue.length) { if (repeat === 1 || !auto) n = 0; else { audio.pause(); audio.currentTime = 0; return; } } }
    idx = n; load();
    if (curView === 'queue') renderQueue();
  }
  function prev() {
    if (!queue.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    idx = (idx - 1 + queue.length) % queue.length; load();
    if (curView === 'queue') renderQueue();
  }
  function toggle() {
    if (!cur()) { const first = $('.row2, .card2'); if (first) first.click(); return; }
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
  }
  let fail = 0;
  audio.addEventListener('error', () => {
    if (!cur()) return;
    say("Couldn't play that one - skipping");
    if (++fail < 4 && queue.length > 1) setTimeout(() => next(true), 600);
  });
  audio.addEventListener('ended', () => next(true));
  audio.addEventListener('play', () => { $('#playIc').innerHTML = PAUSEIC; $$('.row2.cur').forEach((r) => r.classList.add('playing')); });
  audio.addEventListener('pause', () => { $('#playIc').innerHTML = PLAYIC; $$('.row2.cur').forEach((r) => r.classList.remove('playing')); });
  audio.addEventListener('playing', () => { fail = 0; });
  audio.addEventListener('loadedmetadata', () => { $('#tDur').textContent = fmt(audio.duration); });
  let seeking = false;
  audio.addEventListener('timeupdate', () => {
    const d = audio.duration || (cur() && cur().dur) || 0;
    $('#tCur').textContent = fmt(audio.currentTime);
    $('#tDur').textContent = fmt(d);
    if (!seeking && d) setRange($('#seek'), (audio.currentTime / d) * 1000, 1000);
  });
  function setRange(el, v, max) { el.value = v; el.style.setProperty('--p', (v / max) * 100 + '%'); }
  $('#seek').addEventListener('input', (e) => {
    seeking = true;
    const d = audio.duration || (cur() && cur().dur) || 0;
    e.target.style.setProperty('--p', (e.target.value / 10) + '%');
    $('#tCur').textContent = fmt((e.target.value / 1000) * d);
  });
  $('#seek').addEventListener('change', (e) => {
    const d = audio.duration || (cur() && cur().dur) || 0;
    if (d) audio.currentTime = (e.target.value / 1000) * d;
    seeking = false;
  });
  $('#vol').addEventListener('input', (e) => { audio.volume = e.target.value / 100; audio.muted = false; store.set('vol', audio.volume); syncVol(); });
  $('#bVol').addEventListener('click', () => { audio.muted = !audio.muted; syncVol(); });
  function syncVol() {
    const v = audio.muted ? 0 : audio.volume;
    setRange($('#vol'), Math.round(v * 100), 100);
    $('#volIc').innerHTML = v === 0 ? '<path d="M3 9v6h4l5 5V4L7 9zm13.600 3 2.400-2.400-1.400-1.400-2.400 2.400-2.400-2.400-1.400 1.400 2.400 2.400-2.400 2.400 1.400 1.400 2.400-2.400 2.400 2.400 1.400-1.400z"/>' : '<path d="M3 9v6h4l5 5V4L7 9zm13.500 3A4.500 4.500 0 0 0 14 8v8a4.500 4.500 0 0 0 2.500-4z"/>' + (v > 0.5 ? '<path d="M14 3.200v2.100a7 7 0 0 1 0 13.400v2.100a9 9 0 0 0 0-17.600z"/>' : '');
  }
  function syncModes() {
    $('#bShuf').classList.toggle('on', !!shuffle);
    $('#bRep').classList.toggle('on', repeat > 0);
    $('#repOne').style.display = repeat === 2 ? 'block' : 'none';
    $('#bRep').title = ['Repeat off', 'Repeat all', 'Repeat one'][repeat];
  }
  $('#bShuf').onclick = () => { shuffle = !shuffle; store.set('shuffle', shuffle); syncModes(); };
  $('#bRep').onclick = () => { repeat = (repeat + 1) % 3; store.set('repeat', repeat); syncModes(); };
  $('#bPlay').onclick = toggle; $('#bNext').onclick = () => next(false); $('#bPrev').onclick = prev;
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
      navigator.mediaSession.setActionHandler('nexttrack', () => next(false));
      navigator.mediaSession.setActionHandler('previoustrack', prev);
    } catch (e) {}
  }

  /* ---------- Now Playing widget bridge: report the track to the desktop, obey play / pause / next from it ---------- */
  let pubT = 0;
  function publish(force) {
    const now = Date.now();
    if (!force && now - pubT < 900) return;
    pubT = now;
    const t = cur();
    Galaxy.send({ type: 'now-playing', t: t ? { title: t.title, artist: t.artist, art: t.art || '' } : null, playing: !!t && !audio.paused && !audio.ended, pos: audio.currentTime || 0, dur: audio.duration || (t && t.dur) || 0 });
  }
  ['play', 'pause', 'ended', 'seeked', 'loadedmetadata'].forEach((ev) => audio.addEventListener(ev, () => publish(true)));
  audio.addEventListener('timeupdate', () => publish(false));
  addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.type !== 'media-control' || e.source !== parent) return;
    if (d.action === 'toggle') toggle(); else if (d.action === 'next') next(false); else if (d.action === 'prev') prev();
  });

  /* ---------- likes ---------- */
  function toggleLike(t) {
    if (isLiked(t)) likes = likes.filter((x) => x.key !== t.key); else likes = [t, ...likes];
    store.set('likes', likes);
    syncHeart();
    $$('.row2').forEach((r) => { if (r.dataset.key === t.key) { const b = $('.hb', r); const on = isLiked(t); b.classList.toggle('on', on); b.innerHTML = svgIcon(on ? HEART : HEART_LINE); } });
    if (curView === 'liked') show('liked');
  }
  function syncHeart() {
    const t = cur(), b = $('#npHeart');
    const on = !!t && isLiked(t);
    b.classList.toggle('on', on);
    b.style.visibility = t ? 'visible' : 'hidden';
    $('#npHp').setAttribute('d', on ? HEART : HEART_LINE);
    $('#likeCnt').textContent = likes.length || '';
  }
  $('#npHeart').onclick = () => { if (cur()) toggleLike(cur()); };
  function markPlaying() {
    const t = cur();
    $$('.row2, .card2').forEach((el) => {
      const on = !!t && el.dataset.key === t.key;
      el.classList.toggle('cur', on);
      el.classList.toggle('playing', on && !audio.paused);
    });
  }

  /* ---------- search + nav ---------- */
  let typeT;
  function onType() {
    const q = $('#q').value.trim();
    $('#sbox').classList.toggle('has', !!$('#q').value);
    clearTimeout(typeT);
    typeT = setTimeout(() => { lastQuery = q; if (curView !== 'search') { curView = 'search'; $$('.navb').forEach((b) => b.classList.toggle('sel', b.dataset.v === 'search')); } renderSearch(q); }, 380);
  }
  $('#q').addEventListener('input', onType);
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(typeT); lastQuery = $('#q').value.trim(); curView = 'search'; $$('.navb').forEach((b) => b.classList.toggle('sel', b.dataset.v === 'search')); renderSearch(lastQuery); } });
  $('#q').addEventListener('focus', () => { if (curView !== 'search' && curView !== 'home') {} });
  $('#clr').onclick = () => { $('#q').value = ''; $('#sbox').classList.remove('has'); $('#q').focus(); if (curView === 'search') renderSearch(''); };
  $$('.navb').forEach((b) => b.addEventListener('click', () => { show(b.dataset.v); if (b.dataset.v === 'search') $('#q').focus(); }));

  function syncSource() {
    $$('#src button').forEach((b) => b.classList.toggle('on', b.dataset.s === source));
  }
  $$('#src button').forEach((b) => b.addEventListener('click', () => {
    if (source === b.dataset.s) return;
    source = b.dataset.s; store.set('source', source); genre = null; syncSource();
    if (curView === 'search' && $('#q').value.trim()) renderSearch($('#q').value.trim()); else show(curView === 'search' ? 'search' : 'home');
    say(source === 'audius' ? 'Source: Audius (full songs)' : 'Source: iTunes (30s previews)');
  }));

  addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && document.activeElement.type !== 'range';
    if (e.code === 'Space' && !typing) { e.preventDefault(); toggle(); }
    else if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); }
    else if (e.key === 'Escape') $('#q').blur();
    else if (!typing && e.key === 'ArrowRight' && e.shiftKey) next(false);
    else if (!typing && e.key === 'ArrowLeft' && e.shiftKey) prev();
  });

  syncSource(); syncModes(); syncVol(); syncHeart();
  show('home');
  publish(true);
})();
</script>
</body>
</html>
